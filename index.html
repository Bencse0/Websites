<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0d12">
    <title>Főmenü</title>
    <style>
        :root {
            --bg: #0b0d12;
            --card-bg: #131722;
            --card-border: #1f2636;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #3b82f6;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-shell {
            width: 100%;
            max-width: 480px;
        }
        .auth-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .brand-lockup {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
        .brand-mark {
            background: var(--accent);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        .eyebrow {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        .muted {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .role-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .role-card {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }
        .role-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .primary-role {
            border-color: rgba(59, 130, 246, 0.4);
        }
        .role-index {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-right: 16px;
            min-width: 24px;
        }
        .role-card span:nth-child(2) {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .role-card strong {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .role-card small {
            font-size: 13px;
            color: var(--text-muted);
        }
        .role-card b {
            font-size: 18px;
            color: var(--text-muted);
            margin-left: 12px;
            transition: transform 0.2s;
        }
        .role-card:hover b {
            color: var(--accent);
            transform: translateX(4px);
        }
    </style>
</head>
<body>
    <main class="app-shell narrow-shell role-shell">
        <section class="auth-card">
            <div class="brand-lockup"><span class="brand-mark">MENU</span><span>PROJEKT FŐMENÜ</span></div>
            <p class="eyebrow">NAVIKÁCIÓ</p>
            <h1>Válassz oldalt.</h1>
            <p class="muted">Kattints a kívánt menüpontra a továbblépéshez.</p>
            
            <div class="role-actions">
                <!-- 1. GOMB (Így néz ki egy gomb, nyugodtan másold ki és írd át az adatait) -->
                <a class="role-card primary-role" href="MW-Tut1.html">
                    <span class="role-index">01</span>
                    <span><strong>MW-Tutorial 1</strong><small>Most Wanted jaték tutorial első verzió!</small></span>
                    <b>→</b>
                </a>

                <!-- 2. GOMB -->
                <a class="role-card" href="MW-Tut2.html">
                    <span class="role-index">02</span>
                    <span><strong>MW-Tutorial 2</strong><small>Most Wanted jaték tutorial második verzió!</small></span>
                    <b>→</b>
                </a>

                <!-- IDE TUDSZ ÚJABB GOMBOT BESZÚRNI A FENTIEK MINTÁJÁRA -->
            </div>
        </section>
    </main>
</body>
</html>
